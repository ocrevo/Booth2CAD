name: Idea or request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you post
      options:
        - label: I am not attaching client pictures, brand material or project names.
          required: true
  - type: textarea
    id: need
    attributes:
      label: What do you want to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
